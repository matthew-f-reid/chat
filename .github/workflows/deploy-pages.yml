name: Deploy Angular app to GitHub Pages

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 14.21.3
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Build Angular app for GitHub Pages
        run: npm run build -- --configuration production --base-href /chat/

      - name: Add runtime API URL and SPA fallback
        run: node scripts/configure-pages.js
        env:
          CHATTER_BACKEND_URL: ${{ vars.CHATTER_BACKEND_URL }}

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/chat

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
